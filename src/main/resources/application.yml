spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  # UI assets: without Cache-Control, browsers cache app.js/style.css heuristically
  # and can keep running the previous release after a deploy. no-cache makes them
  # revalidate (If-Modified-Since) on every load, so a normal reload picks up a new build.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

xlights:
  data-dir: ${XLIGHTS_DATA_DIR:/data}
  # xLights model groups that always become one WLED segment, when the group's models
  # sit next to each other on one controller. Comma-separated group names.
  segment-groups: ${XLIGHTS_SEGMENT_GROUPS:KET - Dogwood,KET - Yew Left,KET - Yew Right}
  # Falcon Player (FPP) show controller. Only needed when FPP's UI password is on.
  fpp:
    username: ${FPP_USERNAME:admin}
    password: ${FPP_PASSWORD:}

# Daily pre-show check (see docs/preshow.md). Off by default; every site-specific
# value (hosts, Home Assistant entities, URLs, email) comes from the deployment.
preshow:
  enabled: false
  zone: America/New_York

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.ketronkowski.xlights.validation: INFO
    com.ketronkowski.xlights.wled: INFO
    com.ketronkowski.xlights.fpp: INFO
    com.ketronkowski.xlights.web: INFO
    com.ketronkowski.xlights.preshow: INFO
