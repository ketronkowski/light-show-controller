<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <title>Light Show Controller</title>
  <style>body { background: #0a0d12; color: #e7ebf2; font-family: system-ui, sans-serif; } a { color: #ffb020; }</style>
  <!-- Opens the tab this device used last (nav.js remembers it), or Show Control the first time. -->
  <script>
    (function () {
      var tab = 'show.html';
      try {
        var last = localStorage.getItem('lsc.lastTab');
        if (/^(show|controllers|preshow|measure)\.html$/.test(last)) tab = last;
      } catch (e) { /* private window: use the default */ }
      location.replace(tab + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <noscript>
    <p><a href="show.html">Show Control</a> · <a href="controllers.html">Controllers</a> · <a href="preshow.html">Pre-show check</a> · <a href="measure.html">Boundary finder</a></p>
  </noscript>
</body>
</html>
