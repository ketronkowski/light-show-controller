<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre-show check</title>
  <style>
    :root { --bg:#f1f3f4; --card:#ffffff; --ink:#202124; --quiet:#5f6368; --line:#dadce0; --blue:#1a73e8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0d12; --card:#151a22; --ink:#e8eaed; --quiet:#9aa0a6; --line:#2a313c; } }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px; }
    header h1 { font-size:20px; margin:0 12px 0 0; }
    header a { color:var(--blue); font-size:14px; }
    button { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    main { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:0 16px 16px; }
    @media (max-width:760px) { main { grid-template-columns:1fr; } }
    #runs { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:8px; max-height:80vh; overflow:auto; }
    #runs li { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; }
    #runs li.sel { outline:2px solid var(--blue); outline-offset:-2px; }
    #runs .v { font-weight:bold; }
    .GO { color:#188038; } .GO_WITH_WARNINGS { color:#b06000; } .NO_GO { color:#c5221f; }
    #runs .meta { color:var(--quiet); }
    iframe { width:100%; height:80vh; border:1px solid var(--line); border-radius:8px; background:#f1f3f4; }
    #msg, #ltMsg { font-size:13px; color:var(--quiet); }
    #lights { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:0 16px 12px; }
    #lights b { font-size:14px; margin-right:4px; }
    button.quiet { background:transparent; color:var(--blue); border:1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>Pre-show check</h1>
    <button id="runBtn" type="button">Run check now</button>
    <span id="msg"></span>
    <a href="index.html">Back to controllers</a>
  </header>
  <section id="lights" aria-label="Camera light test">
    <b>Camera light test</b>
    <button id="ltRun" type="button">Run light test</button>
    <button id="ltCal" type="button" class="quiet">Calibrate (after dark)</button>
    <button id="ltMiss" type="button" class="quiet">Recalibrate missing models</button>
    <button id="ltStop" type="button" class="quiet" hidden>Stop</button>
    <a id="ltPic" href="lighttest.html" hidden>Latest light test</a>
    <span id="ltMsg"></span>
  </section>
  <main>
    <ul id="runs"></ul>
    <iframe id="report" title="Pre-show report"></iframe>
  </main>
  <script>
    const runsEl = document.getElementById('runs');
    const frame = document.getElementById('report');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('runBtn');
    let selected = new URLSearchParams(location.search).get('run');

    function show(id) {
      selected = id;
      frame.src = `api/preshow/runs/${encodeURIComponent(id)}/report`;
      for (const li of runsEl.children) li.classList.toggle('sel', li.dataset.id === id);
    }

    async function load() {
      const res = await fetch('api/preshow/runs');
      const runs = res.ok ? await res.json() : [];
      runsEl.replaceChildren(...runs.map(r => {
        const li = document.createElement('li');
        li.dataset.id = r.id;
        const when = new Date(r.startedAt).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        li.innerHTML = `<div class="v ${r.verdict}"></div><div class="meta"></div>`;
        li.querySelector('.v').textContent = r.headline;
        li.querySelector('.meta').textContent = `${when} · ${r.pass}`;
        li.onclick = () => show(r.id);
        return li;
      }));
      if (!runs.length) { msg.textContent = 'No runs yet.'; return; }
      show(selected && runs.some(r => r.id === selected) ? selected : runs[0].id);
    }

    btn.onclick = async () => {
      btn.disabled = true;
      msg.textContent = 'Running, this takes up to a minute…';
      try {
        const res = await fetch('api/preshow/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: 'manual' }) });
        if (res.status === 409) { msg.textContent = 'A check is already running.'; return; }
        const run = await res.json();
        selected = run.id;
        msg.textContent = '';
        await load();
      } catch (e) {
        msg.textContent = 'The check could not run: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    const lt = { run: document.getElementById('ltRun'), cal: document.getElementById('ltCal'), miss: document.getElementById('ltMiss'), stop: document.getElementById('ltStop'),
                 pic: document.getElementById('ltPic'), msg: document.getElementById('ltMsg') };
    let ltPoll = null, ltWasBusy = false, ltStarted = 0;

    async function ltStatus() {
      const res = await fetch('api/lighttest/status');
      if (!res.ok) return;
      const s = await res.json();
      document.getElementById('lights').hidden = !s.configured;
      lt.run.disabled = lt.cal.disabled = lt.miss.disabled = s.busy;
      lt.miss.hidden = !s.calibratedAt || s.visibleModels >= s.calibratedModels;
      lt.stop.hidden = !s.busy;
      lt.pic.hidden = !s.calibratedAt;
      const cal = s.calibratedAt ? `Calibrated ${new Date(s.calibratedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}: ${s.visibleModels} of ${s.calibratedModels} models in view.` : 'Not calibrated yet.';
      lt.msg.textContent = s.busy ? `${s.job}: ${s.done} of ${s.total}, ${s.message}` : `${cal} ${s.message || ''}`;
      if (s.busy && !ltPoll) ltPoll = setInterval(ltStatus, 2000);
      if (!s.busy && ltPoll && Date.now() - ltStarted > 15000) { clearInterval(ltPoll); ltPoll = null; }
      if (ltWasBusy && !s.busy) { selected = null; load(); }
      ltWasBusy = s.busy;
    }

    async function ltPost(path) {
      const res = await fetch('api/lighttest/' + path, { method: 'POST' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        lt.msg.textContent = body.error || `Could not start (HTTP ${res.status}).`;
        return;
      }
      ltStarted = Date.now();
      if (!ltPoll) ltPoll = setInterval(ltStatus, 2000);
    }

    lt.run.onclick = () => ltPost('run');
    lt.cal.onclick = () => { if (confirm('Calibrate now? Every model lights up one at a time for about 5 minutes. Do this after dark with nobody in front of the camera.')) ltPost('calibrate'); };
    lt.miss.onclick = () => { if (confirm('Relight only the models the camera could not see last time (after a repair), and add them to the calibration? Takes under a minute. Do this after dark.')) ltPost('calibrate?missing=true'); };
    lt.stop.onclick = () => ltPost('stop');

    load();
    ltStatus();
  </script>
</body>
</html>
