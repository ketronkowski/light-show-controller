<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <title>Pre-show check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="show.css" />
  <link rel="stylesheet" href="preshow.css" />
  <link rel="stylesheet" href="nav.css" />
</head>
<body class="show-page preshow-page" data-tab="preshow">
  <script src="nav.js"></script>
  <header class="sc-top">
    <h1>Pre-show check</h1>
  </header>

  <main class="ps-grid">
    <section class="sc-card ps-check" aria-labelledby="checkTitle">
      <h2 id="checkTitle">Check</h2>
      <div class="ps-buttons">
        <button id="runBtn" class="action" type="button">Run check now</button>
      </div>
      <p id="msg" class="ps-msg" aria-live="polite"></p>
    </section>

    <section id="lights" class="sc-card ps-lights" aria-labelledby="ltTitle">
      <h2 id="ltTitle">Camera light test</h2>
      <div class="ps-buttons">
        <button id="ltRun" class="action" type="button">Run light test</button>
        <button id="ltCal" type="button">Calibrate (after dark)</button>
        <button id="ltMiss" type="button">Recalibrate missing</button>
        <button id="ltStop" class="action danger" type="button" hidden>Stop</button>
      </div>
      <a id="ltPic" href="lighttest.html" class="ps-link" hidden>Latest light test <span aria-hidden="true">›</span></a>
      <p id="ltMsg" class="ps-msg" aria-live="polite"></p>
    </section>

    <section class="sc-card ps-runs-card" aria-labelledby="runsTitle">
      <h2 id="runsTitle">Runs</h2>
      <ul id="runs" class="ps-runs"></ul>
    </section>

    <section class="ps-report" aria-labelledby="reportTitle">
      <div class="ps-report-head">
        <h2 id="reportTitle">Report</h2>
        <a id="openReport" class="ps-link" target="_blank" rel="noopener" hidden>Open full screen <span aria-hidden="true">↗</span></a>
      </div>
      <iframe id="report" title="Pre-show report"></iframe>
    </section>
  </main>

  <script>
    const runsEl = document.getElementById('runs');
    const frame = document.getElementById('report');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('runBtn');
    let selected = new URLSearchParams(location.search).get('run');

    const openReport = document.getElementById('openReport');
    const PHONE_MQ = window.matchMedia('(max-width: 760px), (max-height: 500px)');

    // The report is same-origin, so the frame grows to fit it instead of scrolling inside the page.
    let fitObserver = null;
    frame.addEventListener('load', () => {
      fitObserver?.disconnect();
      const doc = frame.contentDocument;
      if (!doc?.body) return;
      const fit = () => { frame.style.height = doc.documentElement.scrollHeight + 'px'; };
      fit();
      fitObserver = new ResizeObserver(fit);
      fitObserver.observe(doc.body);
    });

    function show(id) {
      selected = id;
      const url = `api/preshow/runs/${encodeURIComponent(id)}/report`;
      frame.src = url;
      openReport.href = url;
      openReport.hidden = false;
      for (const li of runsEl.children) li.classList.toggle('sel', li.dataset.id === id);
    }

    async function load() {
      const res = await fetch('api/preshow/runs');
      const runs = res.ok ? await res.json() : [];
      runsEl.replaceChildren(...runs.map(r => {
        const li = document.createElement('li');
        li.dataset.id = r.id;
        const when = new Date(r.startedAt).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        li.innerHTML = `<div class="v ${r.verdict}"></div><div class="meta"></div>`;
        li.querySelector('.v').textContent = r.headline;
        li.querySelector('.meta').textContent = `${when} · ${r.pass}`;
        li.onclick = () => {
          show(r.id);
          if (PHONE_MQ.matches) frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        return li;
      }));
      if (!runs.length) { msg.textContent = 'No runs yet.'; return; }
      show(selected && runs.some(r => r.id === selected) ? selected : runs[0].id);
    }

    btn.onclick = async () => {
      btn.disabled = true;
      msg.textContent = 'Running, this takes up to a minute…';
      try {
        const res = await fetch('api/preshow/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: 'manual' }) });
        if (res.status === 409) { msg.textContent = 'A check is already running.'; return; }
        const run = await res.json();
        selected = run.id;
        msg.textContent = '';
        await load();
      } catch (e) {
        msg.textContent = 'The check could not run: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    const lt = { run: document.getElementById('ltRun'), cal: document.getElementById('ltCal'), miss: document.getElementById('ltMiss'), stop: document.getElementById('ltStop'),
                 pic: document.getElementById('ltPic'), msg: document.getElementById('ltMsg') };
    let ltPoll = null, ltWasBusy = false, ltStarted = 0;

    async function ltStatus() {
      const res = await fetch('api/lighttest/status');
      if (!res.ok) return;
      const s = await res.json();
      document.getElementById('lights').hidden = !s.configured;
      lt.run.disabled = lt.cal.disabled = lt.miss.disabled = s.busy;
      lt.miss.hidden = !s.calibratedAt || s.visibleModels >= s.calibratedModels;
      lt.stop.hidden = !s.busy;
      lt.pic.hidden = !s.calibratedAt;
      const cal = s.calibratedAt ? `Calibrated ${new Date(s.calibratedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}: ${s.visibleModels} of ${s.calibratedModels} models in view.` : 'Not calibrated yet.';
      lt.msg.textContent = s.busy ? `${s.job}: ${s.done} of ${s.total}, ${s.message}` : `${cal} ${s.message || ''}`;
      if (s.busy && !ltPoll) ltPoll = setInterval(ltStatus, 2000);
      if (!s.busy && ltPoll && Date.now() - ltStarted > 15000) { clearInterval(ltPoll); ltPoll = null; }
      if (ltWasBusy && !s.busy) { selected = null; load(); }
      ltWasBusy = s.busy;
    }

    async function ltPost(path) {
      const res = await fetch('api/lighttest/' + path, { method: 'POST' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        lt.msg.textContent = body.error || `Could not start (HTTP ${res.status}).`;
        return;
      }
      ltStarted = Date.now();
      if (!ltPoll) ltPoll = setInterval(ltStatus, 2000);
    }

    lt.run.onclick = () => ltPost('run');
    lt.cal.onclick = () => { if (confirm('Calibrate now? Every model lights up one at a time for about 5 minutes. Do this after dark with nobody in front of the camera.')) ltPost('calibrate'); };
    lt.miss.onclick = () => { if (confirm('Relight only the models the camera could not see last time (after a repair), and add them to the calibration? Takes under a minute. Do this after dark.')) ltPost('calibrate?missing=true'); };
    lt.stop.onclick = () => ltPost('stop');

    load();
    ltStatus();
  </script>
</body>
</html>
